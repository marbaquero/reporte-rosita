const SUPABASE_URL = "https://ywegbbdnphbbqiimqhqf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3RLMrZi5yuz9kxeAiMkSMw_y4foVtyu";
const ADMIN_PIN = "";
const TOKEN_EXPIRY_HOURS = 72;
const TOKEN_PARAM = "token";

const H = {apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json'};

function buildQuery(table){
  let cols = '*';
  let filters = [];
  let orderCol = null, orderAsc = true, limitN = null, singleMode = null;
  const q = {
    select(c){ cols = c || '*'; return q; },
    eq(col, val){ filters.push(col + '=eq.' + encodeURIComponent(val)); return q; },
    order(col, opts){ orderCol = col; orderAsc = !(opts && opts.ascending === false); return q; },
    limit(n){ limitN = n; return q; },
    maybeSingle(){ singleMode = 'maybe'; return q.exec(); },
    single(){ singleMode = 'single'; return q.exec(); },
    async exec(){
      let url = SUPABASE_URL + '/rest/v1/' + table + '?select=' + encodeURIComponent(cols);
      if(filters.length) url += '&' + filters.join('&');
      if(orderCol) url += '&order=' + encodeURIComponent(orderCol) + (orderAsc ? '.asc' : '.desc');
      if(limitN) url += '&limit=' + limitN;
      try{
        const r = await fetch(url, {headers: H});
        if(!r.ok) return {data: null, error: {message: await r.text()}};
        const j = await r.json();
        if(singleMode === 'maybe') return {data: j[0] || null, error: null};
        if(singleMode === 'single') return {data: j[0] || null, error: j.length ? null : {message: 'No rows'}};
        return {data: j, error: null};
      }catch(e){ return {data: null, error: e}; }
    },
    then(resolve, reject){ return q.exec().then(resolve, reject); }
  };
  return q;
}

const sb = {
  from(table){
    return {
      select(cols){ return buildQuery(table).select(cols); },
      insert(payload){
        return (async ()=>{
          try{
            const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, {method: 'POST', headers: {...H, Prefer: 'return=representation'}, body: JSON.stringify(payload)});
            if(!r.ok) return {data: null, error: {message: await r.text()}};
            const j = await r.json();
            return {data: j, error: null};
          }catch(e){ return {data: null, error: e}; }
        })();
      },
      update(payload){
        let filters = [];
        const u = {
          eq(col, val){ filters.push(col + '=eq.' + encodeURIComponent(val)); return u; },
          then(resolve, reject){
            (async ()=>{
              try{
                let url = SUPABASE_URL + '/rest/v1/' + table + '?' + filters.join('&');
                const r = await fetch(url, {method: 'PATCH', headers: {...H, Prefer: 'return=representation'}, body: JSON.stringify(payload)});
                if(!r.ok) return resolve({data: null, error: {message: await r.text()}});
                const j = await r.json();
                resolve({data: j, error: null});
              }catch(e){ resolve({data: null, error: e}); }
            })();
          }
        };
        return u;
      },
      delete(){
        let filters = [];
        const d = {
          eq(col, val){ filters.push(col + '=eq.' + encodeURIComponent(val)); return d; },
          then(resolve, reject){
            (async ()=>{
              try{
                let url = SUPABASE_URL + '/rest/v1/' + table + '?' + filters.join('&');
                const r = await fetch(url, {method: 'DELETE', headers: H});
                if(!r.ok) return resolve({data: null, error: {message: await r.text()}});
                resolve({data: [], error: null});
              }catch(e){ resolve({data: null, error: e}); }
            })();
          }
        };
        return d;
      }
    };
  }
};
