<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial — Reportes</title>
<link rel="apple-touch-icon" href="icono-dashboard-rosita.png">
<link rel="icon" type="image/png" href="icono-dashboard-rosita.png">
<meta name="apple-mobile-web-app-title" content="Historial">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF6EE;
    --paper-line: #E7DFCC;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --sage: #5C7255;
    --sage-deep: #3F5638;
    --sage-tint: #EAF0E6;
    --brick: #B85138;
    --brick-tint: #F3E4DE;
    --card: #FFFFFF;
    --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 8px 24px rgba(43,38,32,0.05);
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height:1.45;
    padding-bottom: 60px;
  }
  .top{ max-width: 900px; margin:0 auto; padding: 34px 20px 10px; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--sage-deep); display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:""; width:6px; height:6px; border-radius:50%; background: var(--sage); }
  h1{
    font-family: 'Fraunces', serif; font-weight:600;
    font-size: clamp(26px, 5vw, 34px); margin: 6px 0 4px; letter-spacing:-0.01em;
  }
  .sub{ color: var(--ink-soft); font-size: 14px; }
  .sub a{ color: var(--sage-deep); }

  .stats{
    max-width:900px; margin: 18px auto 0; padding: 0 20px;
    display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;
  }
  .stat{
    background: var(--card); border:1px solid var(--paper-line); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .stat .n{ font-family:'Fraunces', serif; font-size: 22px; font-weight:600; }
  .stat .l{ font-family:'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  @media (max-width: 640px){ .stats{ grid-template-columns: repeat(2,1fr);} }

  .controls{
    max-width:900px; margin: 18px auto 0; padding: 0 20px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  .controls input[type="text"], .controls input[type="date"], .controls select{
    font-family:'Work Sans', sans-serif; font-size: 14px;
    border: 1.5px solid var(--paper-line); background: var(--card);
    border-radius: 10px; padding: 9px 12px; color: var(--ink);
  }
  #search{ flex:1; min-width: 180px; }
  .controls button{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size: 13.5px;
    border: 1.5px solid var(--paper-line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 9px 14px; cursor:pointer;
  }
  .controls button.primary{ background: var(--sage-deep); border-color: var(--sage-deep); color:#fff; }
  .controls button.active{ background: var(--brick); border-color: var(--brick); color:#fff; }
  .controls button:active{ transform: scale(0.98); }

  .delete-btn{
    display:none;
    font-family:'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--brick); background: var(--brick-tint); border: none;
    border-radius: 8px; padding: 6px 10px; cursor:pointer; margin-top: 12px; margin-right: 8px;
  }
  .edit-btn{
    display:none;
    font-family:'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--sage-deep); background: var(--sage-tint); border: none;
    border-radius: 8px; padding: 6px 10px; cursor:pointer; margin-top: 12px;
  }
  body.admin-mode .delete-btn, body.admin-mode .edit-btn{ display:inline-block; }
  body.admin-mode .entry{ border-left: 3px solid var(--brick); }

  .edit-panel{
    display:none; margin-top: 12px; padding: 12px; background: var(--paper);
    border-radius: 10px; border: 1px dashed var(--paper-line);
  }
  .edit-panel.open{ display:block; }
  .edit-panel label{
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; text-transform:uppercase;
    letter-spacing:.05em; color: var(--ink-soft); display:block; margin-bottom: 4px;
  }
  .edit-panel .row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 10px; }
  .edit-panel input, .edit-panel select{
    font-family:'Work Sans', sans-serif; font-size: 14px;
    border: 1.5px solid var(--paper-line); border-radius: 8px; padding: 7px 10px;
    background: var(--card); color: var(--ink);
  }
  .edit-panel .save-btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size: 13px;
    background: var(--sage-deep); color:#fff; border:none; border-radius: 8px;
    padding: 8px 14px; cursor:pointer; margin-right: 8px;
  }
  .edit-panel .cancel-btn{
    font-family:'Work Sans', sans-serif; font-size: 13px;
    background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-line);
    border-radius: 8px; padding: 8px 14px; cursor:pointer;
  }

  .list{ max-width:900px; margin: 20px auto 0; padding: 0 20px; display:flex; flex-direction:column; gap:12px; }

  .entry{
    background: var(--card); border:1px solid var(--paper-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 18px; cursor:pointer;
  }
  .entry.flagged{ border-color: var(--brick); }

  .entry-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .entry-date{
    font-family:'Fraunces', serif; font-weight:600; font-size: 18px;
  }
  .entry-date small{
    display:block; font-family:'IBM Plex Mono', monospace; font-weight:500;
    font-size: 11px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;
  }
  .badges{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; padding: 3px 8px;
    border-radius: 20px; background: var(--sage-tint); color: var(--sage-deep); white-space:nowrap;
  }
  .badge.warn{ background: var(--brick-tint); color: var(--brick); }

  .entry-summary{ font-size: 13.5px; color: var(--ink-soft); margin-top: 8px; }
  .entry-summary strong{ color: var(--ink); font-weight:600; }

  .entry-detail{
    display:none; margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
    font-size: 14px;
  }
  .entry.open .entry-detail{ display:block; }
  .detail-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  @media (max-width:520px){ .detail-grid{ grid-template-columns: 1fr; } }
  .detail-row .k{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); }
  .detail-row .v{ margin-top: 2px; }
  .obs-box{
    margin-top: 12px; background: var(--paper); border-radius: 10px; padding: 10px 12px;
    font-size: 13.5px; white-space: pre-wrap;
  }

  .empty{
    max-width:900px; margin: 40px auto; padding: 40px 20px; text-align:center;
    color: var(--ink-soft); font-family:'Fraunces', serif; font-size:17px;
  }

  footer{
    max-width: 900px; margin: 30px auto 0; padding: 0 20px; text-align:center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
  }
  footer a{ color: var(--sage-deep); }
</style>
</head>
<body>

<div class="top">
  <div class="eyebrow">Historial</div>
  <h1>Reportes de <em id="recipientName" style="font-style:italic;color:var(--sage-deep);">tu familiar</em></h1>
  <p class="sub">Todos los reportes enviados desde el formulario. <a href="./index.html">+ nuevo reporte</a> · <a href="./sesion-cognitiva.html#historial">Sesiones cognitivas →</a></p>
  <div id="profileSetup" style="display:none; max-width:900px; margin:14px auto 0; padding:14px 16px; background:var(--paper); border-radius:10px; display:none; align-items:center; gap:10px; flex-wrap:wrap;">
    <label for="recipientInput" style="font-size:13px; font-weight:600; color:var(--ink);">¿Cómo se llama tu familiar?</label>
    <input id="recipientInput" type="text" maxlength="60" placeholder="Ej. María" style="padding:8px 10px; border:1px solid var(--paper-line); border-radius:8px; font-size:14px; min-width:180px;">
    <button id="saveRecipient" style="padding:8px 14px; border:0; border-radius:8px; background:var(--sage-deep); color:#fff; font-size:13px; font-weight:600; cursor:pointer;">Guardar</button>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <select id="cuidadoraFilter">
    <option value="">Todas las cuidadoras</option>
  </select>
  <input type="text" id="search" placeholder="Buscar en observaciones...">
  <input type="date" id="from">
  <input type="date" id="to">
  <button id="clearFilters">Limpiar</button>
  <button id="exportCsv" class="primary">Exportar CSV</button>
  <button id="adminToggle">Modo administrador</button>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none;">Todavía no hay reportes que coincidan.</div>

<footer>historial de reportes · <a href="./index.html">nuevo reporte</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let ALL = [];
  let HOUSEHOLD_ID = null;

  function mapRow(r){
    return {
      ...r,
      fecha: r.report_date,
      cuidadora: r.caregiver_name
    };
  }

  async function initOwner(){
    const { data: { session }, error } = await sb.auth.getSession();
    
    }
    const { data: member, error: memberError } = await sb
      .from('household_members')
      .select('household_id, role')
      .eq('user_id', session.user.id)
      .eq('role', 'owner')
      .limit(1)
      .maybeSingle();
    if (memberError || !member) {
      document.getElementById('list').innerHTML = '';
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'Esta cuenta no está vinculada a un hogar. Inicie sesión desde el portal.';
      return null;
    }
    HOUSEHOLD_ID = member.household_id;
    await loadRecipientName();
    return session;
  }

  let PROFILE = {};

  async function loadRecipientName(){
    const { data } = await sb.from('app_kv_store')
      .select('value')
      .eq('household_id', HOUSEHOLD_ID)
      .eq('key', 'profile')
      .maybeSingle();
    PROFILE = (data && data.value) || {};
    const name = PROFILE.care_recipient;
    if (name) {
      document.getElementById('recipientName').textContent = name;
    } else {
      const setup = document.getElementById('profileSetup');
      setup.style.display = 'flex';
      document.getElementById('recipientInput').focus();
    }
  }

  async function saveRecipientName(){
    const input = document.getElementById('recipientInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const btn = document.getElementById('saveRecipient');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    PROFILE = { ...PROFILE, care_recipient: name };
    const { error } = await sb.from('app_kv_store').upsert({
      household_id: HOUSEHOLD_ID,
      key: 'profile',
      value: PROFILE,
      updated_at: new Date().toISOString()
    }, { onConflict: 'household_id,key' });
    btn.disabled = false;
    btn.textContent = 'Guardar';
    if (error) {
      console.error(error);
      btn.textContent = 'No se pudo guardar';
      return;
    }
    document.getElementById('recipientName').textContent = name;
    document.getElementById('profileSetup').style.display = 'none';
  }

  function renderCaregiverOptions(){
    const sel = document.getElementById('cuidadoraFilter');
    const current = sel.value;
    const names = [...new Set(ALL.map(r => r.cuidadora).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">Todas las cuidadoras</option>' +
      names.map(n => `<option>${n}</option>`).join('');
    sel.value = current;
  }

  document.getElementById('saveRecipient').addEventListener('click', saveRecipientName);
  document.getElementById('recipientInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveRecipientName();
  });

  function fmtDate(iso){
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('es-EC', { day:'numeric', month:'long', year:'numeric' });
  }
  const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  function diaDeSemana(iso){
    const d = new Date(iso + 'T12:00:00');
    return DIAS[d.getDay()];
  }
  function arr(a){ return Array.isArray(a) ? a : []; }

  function render(rows){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';
    empty.style.display = rows.length ? 'none' : 'block';

    for (const r of rows) {
      const dificultad = arr(r.medicacion).some(m => m.toLowerCase().includes('dificultad'));
      const requirioLimpieza = arr(r.estado_casa).some(m => m.toLowerCase().includes('requirió'));
      const flagged = dificultad;

      const el = document.createElement('div');
      el.className = 'entry' + (flagged ? ' flagged' : '');
      const tieneNoche = !!(r.como_durmio || r.veces_desperto || r.como_amanecio || r.hora_acostada);
      const tieneDia = !tieneNoche || !!(r.desayuno || r.almuerzo || r.merienda || r.hidratacion);

      const badges = [];
      if (r.cuidadora) badges.push(`<span class="badge" style="background:var(--card);border:1px solid var(--paper-line);color:var(--ink);">${r.cuidadora}</span>`);
      if (dificultad) badges.push('<span class="badge warn">Dificultad con medicación</span>');
      if (requirioLimpieza) badges.push('<span class="badge warn">Requirió limpieza</span>');
      if (r.presion_arterial) badges.push(`<span class="badge">${r.presion_arterial}</span>`);

      const resumenDia = `Desayuno: ${r.desayuno || '—'} · Almuerzo: ${r.almuerzo || '—'} · Merienda: ${r.merienda || '—'}`;
      const resumenNoche = `Se durmió: ${r.como_durmio || '—'} · Despertares: ${r.veces_desperto || '—'} · Amaneció: ${r.como_amanecio || '—'}`;
      const summaryLine = '— ' + [tieneDia ? resumenDia : null, tieneNoche ? resumenNoche : null].filter(Boolean).join(' · ');

      const row = (k, v) => `<div class="detail-row"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      const detailRows = [
        row('Estado general', arr(r.estado_general).join(', ') || '—'),
        tieneDia ? row('Hidratación', r.hidratacion || '—') : '',
        tieneNoche ? row('Hora en que se acostó', r.hora_acostada || '—') : '',
        tieneNoche ? row('Cómo se durmió', r.como_durmio || '—') : '',
        tieneNoche ? row('Veces que se despertó', r.veces_desperto || '—') : '',
        tieneNoche ? row('Motivo del despertar', arr(r.motivo_despertar).join(', ') || '—') : '',
        tieneNoche ? row('Fue al baño en la noche', r.fue_al_bano_noche || '—') : '',
        tieneNoche ? row('Cómo amaneció', r.como_amanecio || '—') : '',
        row('Medicación', arr(r.medicacion).join(', ') || '—'),
        row('Presión arterial', r.presion_arterial || '—'),
        tieneDia ? row('Actividades', arr(r.actividades).join(', ') || '—') : '',
        row('Estado de la casa', arr(r.estado_casa).join(', ') || '—'),
      ].join('\n');

      el.innerHTML = `
        <div class="entry-head">
          <div class="entry-date">${fmtDate(r.fecha)}<small>${r.dia_turno || ''}</small></div>
          <div class="badges">${badges.join('')}</div>
        </div>
        <div class="entry-summary">
          <strong>${arr(r.estado_general)[0] || 'Sin estado registrado'}</strong>
          ${summaryLine}
        </div>
        <div class="entry-detail">
          <div class="detail-grid">
            ${detailRows}
          </div>
          ${r.observaciones ? `<div class="obs-box">${r.observaciones}</div>` : ''}
          <button class="edit-btn" data-id="${r.id}">Editar</button>
          <button class="delete-btn" data-id="${r.id}">Eliminar este reporte</button>
          <div class="edit-panel">
            <div class="row">
              <div>
                <label>Fecha</label>
                <input type="date" class="edit-fecha" value="${r.fecha}">
              </div>
              <div>
                <label>Cuidadora</label>
                <select class="edit-cuidadora">
                  <option value="" ${!r.cuidadora ? 'selected' : ''}>—</option>
                  ${[...new Set(ALL.map(x => x.cuidadora).filter(Boolean))].map(n =>
                    `<option ${n === r.cuidadora ? 'selected' : ''}>${n}</option>`
                  ).join('')}
                </select>
              </div>
            </div>
            <button class="save-btn" data-id="${r.id}">Guardar cambios</button>
            <button class="cancel-btn">Cancelar</button>
          </div>
        </div>
      `;
      el.addEventListener('click', (e) => {
        if (e.target.closest('.delete-btn, .edit-btn, .edit-panel')) return;
        el.classList.toggle('open');
      });
      el.querySelector('.edit-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        el.querySelector('.edit-panel').classList.toggle('open');
      });
      el.querySelector('.cancel-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        el.querySelector('.edit-panel').classList.remove('open');
      });
      el.querySelector('.save-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const newFecha = el.querySelector('.edit-fecha').value;
        const newCuidadora = el.querySelector('.edit-cuidadora').value || null;
        if (!newFecha) { alert('La fecha no puede estar vacía.'); return; }
        const { error } = await sb.from('care_reports')
          .update({ report_date: newFecha, caregiver_name: newCuidadora, dia_turno: diaDeSemana(newFecha) })
          .eq('id', r.id);
        if (error) {
          alert('No se pudo guardar el cambio. Intenta de nuevo.');
          console.error(error);
          return;
        }
        load();
      });
      el.querySelector('.delete-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`¿Eliminar el reporte de ${fmtDate(r.fecha)}${r.cuidadora ? ' (' + r.cuidadora + ')' : ''}? Esto no se puede deshacer.`)) return;
        const { error } = await sb.from('care_reports').delete().eq('id', r.id);
        if (error) {
          alert('No se pudo eliminar. Intenta de nuevo.');
          console.error(error);
          return;
        }
        load();
      });
      list.appendChild(el);
    }
  }

  function renderStats(rows){
    const total = rows.length;
    const dificultades = rows.filter(r => arr(r.medicacion).some(m => m.toLowerCase().includes('dificultad'))).length;
    const last = rows[0] ? fmtDate(rows[0].fecha) : '—';
    const buenHumor = rows.filter(r => arr(r.estado_general).some(m => m.toLowerCase().includes('tranquila'))).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${total}</div><div class="l">Reportes</div></div>
      <div class="stat"><div class="n">${total ? Math.round(buenHumor/total*100) : 0}%</div><div class="l">Buen ánimo</div></div>
      <div class="stat"><div class="n">${dificultades}</div><div class="l">Con dificultad</div></div>
      <div class="stat" style="grid-column:span 1;"><div class="n" style="font-size:15px;">${last}</div><div class="l">Último reporte</div></div>
    `;
  }

  function applyFilters(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    const cuidadora = document.getElementById('cuidadoraFilter').value;
    let rows = ALL;
    if (cuidadora) rows = rows.filter(r => r.cuidadora === cuidadora);
    if (q) rows = rows.filter(r => (r.observaciones || '').toLowerCase().includes(q));
    if (from) rows = rows.filter(r => r.fecha >= from);
    if (to) rows = rows.filter(r => r.fecha <= to);
    render(rows);
    renderStats(rows);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('from').addEventListener('change', applyFilters);
  document.getElementById('to').addEventListener('change', applyFilters);
  document.getElementById('cuidadoraFilter').addEventListener('change', applyFilters);
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.getElementById('search').value = '';
    document.getElementById('from').value = '';
    document.getElementById('to').value = '';
    document.getElementById('cuidadoraFilter').value = '';
    applyFilters();
  });

  // The owner is authenticated by Supabase. Editing is enabled by that session;
  // the old client-side PIN was not a security boundary.
  document.body.classList.add('admin-mode');
  document.getElementById('adminToggle').style.display = 'none';

  document.getElementById('exportCsv').addEventListener('click', () => {
    const cols = ['fecha','cuidadora','dia_turno','estado_general','desayuno','almuerzo','merienda','hidratacion','hora_acostada','como_durmio','veces_desperto','motivo_despertar','fue_al_bano_noche','como_amanecio','medicacion','presion_arterial','actividades','estado_casa','observaciones'];
    const rows = ALL;
    const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => {
      let v = r[c];
      if (Array.isArray(v)) v = v.join('; ');
      v = (v ?? '').toString().replace(/"/g, '""');
      return `"${v}"`;
    }).join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reportes-${todayStr()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  async function load(){
    const { data, error } = await sb.from('care_reports')
      .select('*')
      .order('report_date', { ascending:false })
      .order('created_at', { ascending:false });
    if (error) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'No se pudo cargar el historial. Revisa la conexión.';
      console.error(error);
      return;
    }
    ALL = (data || []).map(mapRow);
    renderCaregiverOptions();
    render(ALL);
    renderStats(ALL);
  }

  initOwner().then((session) => { if (session) load(); });
</script>
</body>
</html>
