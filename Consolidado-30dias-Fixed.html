<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consolidado 30 días - Rosita - DEBUG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold">Consolidado 30 días - Rosita</h1>
    <p class="text-sm text-gray-600">Versión debug que detecta automáticamente tu configuración</p>
    
    <!-- DEBUG INFO -->
    <div id="debug" class="mt-4 bg-yellow-50 border border-yellow-200 p-4 rounded-lg text-xs font-mono whitespace-pre-wrap"></div>

    <div class="mt-4 flex gap-2 flex-wrap">
      <button id="btnCSV" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">⬇ Exportar CSV para Google Sheets</button>
      <button id="btnSheets" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">📊 Copiar para Sheets (TAB)</button>
      <a href="./index.html" class="px-4 py-2 bg-white border rounded-lg text-sm">Formulario</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
      <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">TOTAL</div><div id="total" class="text-2xl font-bold">—</div><div id="dias" class="text-xs text-gray-500"></div></div>
      <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">POR CUIDADORA</div><div id="porCuidadora" class="mt-2 text-sm"></div></div>
      <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">RANGO</div><div id="rango" class="mt-2 text-sm"></div><div class="mt-3 flex gap-2"><input type="date" id="desde" class="border rounded px-2 py-1 text-sm"><input type="date" id="hasta" class="border rounded px-2 py-1 text-sm"><button id="btnFiltrar" class="px-3 py-1 bg-black text-white rounded text-sm">Actualizar</button></div></div>
    </div>

    <div id="status" class="mt-4 text-sm"></div>

    <div class="mt-4 bg-white rounded-xl border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-xs" id="tabla"><thead id="thead" class="bg-gray-100"></thead><tbody id="tbody"></tbody></table>
      </div>
    </div>

    <div id="raw" class="mt-4 bg-gray-900 text-green-400 p-4 rounded text-xs overflow-auto max-h-64 hidden"></div>
  </div>

<script src="./config.js"></script>
<script>
// Fallback if config.js not loaded or has placeholder
let SUPABASE_URL_FINAL = (typeof SUPABASE_URL !== 'undefined') ? SUPABASE_URL : null;
let SUPABASE_KEY_FINAL = (typeof SUPABASE_ANON_KEY !== 'undefined') ? SUPABASE_ANON_KEY : null;

const debugEl = document.getElementById('debug');
function logDebug(msg) {
  debugEl.textContent += msg + "\n";
}

logDebug(`URL: ${window.location.href}`);
logDebug(`config.js SUPABASE_URL: ${SUPABASE_URL_FINAL || 'NO DEFINIDO'}`);
logDebug(`config.js SUPABASE_ANON_KEY: ${SUPABASE_KEY_FINAL ? SUPABASE_KEY_FINAL.substring(0,20)+'...' : 'NO DEFINIDO'}`);
if (SUPABASE_KEY_FINAL && SUPABASE_KEY_FINAL.includes('PEGA_AQUI')) {
  logDebug('⚠️ ERROR: config.js aún tiene PEGA_AQUI_TU_ANON_KEY. Reemplázalo con tu anon key real de Supabase Dashboard > Project Settings > API');
}

let client = null;
let datosActuales = [];

function initClient() {
  if (!SUPABASE_URL_FINAL || !SUPABASE_KEY_FINAL || SUPABASE_KEY_FINAL.includes('PEGA_AQUI')) {
    document.getElementById('status').innerHTML = '<span class="text-red-600 font-bold">config.js no tiene la clave real. Abre config.js en GitHub y pega tu anon key. Mira el cuadro amarillo arriba.</span>';
    return false;
  }
  try {
    client = window.supabase.createClient(SUPABASE_URL_FINAL, SUPABASE_KEY_FINAL);
    logDebug('✓ Cliente Supabase creado');
    return true;
  } catch(e) {
    logDebug('✗ Error creando cliente: ' + e.message);
    return false;
  }
}

function setDefaultDates() {
  const hoy = new Date();
  const hace30 = new Date();
  hace30.setDate(hoy.getDate() - 30);
  document.getElementById('desde').value = hace30.toISOString().split('T')[0];
  document.getElementById('hasta').value = hoy.toISOString().split('T')[0];
  document.getElementById('rango').textContent = `${hace30.toLocaleDateString()} - ${hoy.toLocaleDateString()}`;
}

async function cargarDatos() {
  if (!client) { if (!initClient()) return; }
  
  const desde = document.getElementById('desde').value;
  const hasta = document.getElementById('hasta').value;
  const desdeISO = new Date(desde + 'T00:00:00').toISOString();
  const hastaISO = new Date(hasta + 'T23:59:59').toISOString();

  document.getElementById('status').textContent = 'Buscando tablas...';
  
  // Tablas posibles - probamos en orden
  const tablasPosibles = ['reportes', 'reportes_rosita', 'reporte_rosita', 'reportes_diarios', 'rosita', 'reporte'];
  let data = null;
  let tablaUsada = null;
  let columnaFecha = null;

  for (const tabla of tablasPosibles) {
    // intenta con fecha, created_at, fecha_reporte, hora
    for (const colFecha of ['fecha', 'created_at', 'fecha_reporte', 'fecha_hora', 'timestamp']) {
      logDebug(`Probando ${tabla}.${colFecha} >= ${desde}`);
      const res = await client.from(tabla).select('*').gte(colFecha, desdeISO).lte(colFecha, hastaISO).order(colFecha, {ascending:false}).limit(500);
      if (!res.error) {
        data = res.data;
        tablaUsada = tabla;
        columnaFecha = colFecha;
        logDebug(`✓ Encontrado! Tabla: ${tabla}, columna fecha: ${colFecha}, filas: ${data.length}`);
        break;
      } else {
        if (!res.error.message.includes('column') && !res.error.message.includes('does not exist')) {
          logDebug(`  Error ${tabla}.${colFecha}: ${res.error.message}`);
        }
      }
    }
    if (data) break;
  }

  if (!data) {
    document.getElementById('status').innerHTML = `<span class="text-red-600">No se encontró ninguna tabla con datos. Probé: ${tablasPosibles.join(', ')}. Revisa en Supabase > Table Editor cuál es el nombre real de tu tabla. Error típico: RLS bloqueando anon. Ve a Supabase > Authentication > Policies y asegúrate de que SELECT está permitido para anon.</span>`;
    logDebug('✗ Ninguna tabla funcionó. Verifica nombre de tabla y políticas RLS en Supabase.');
    // Muestra raw para debug
    const test = await client.from('reportes').select('*').limit(1);
    logDebug('Test reportes limit 1: ' + JSON.stringify(test));
    return;
  }

  datosActuales = data;
  document.getElementById('status').innerHTML = `✓ <b>${datosActuales.length} reportes</b> encontrados en tabla <code>${tablaUsada}</code> usando columna <code>${columnaFecha}</code> • ${desde} a ${hasta} • Todas las cuidadoras incluidas`;
  
  // Guarda info para export
  window._tablaUsada = tablaUsada;

  // Resumen
  document.getElementById('total').textContent = datosActuales.length;
  const diasUnicos = new Set(datosActuales.map(r => {
    const f = r[columnaFecha] || r.fecha || r.created_at || '';
    return String(f).split('T')[0];
  })).size;
  document.getElementById('dias').textContent = `${diasUnicos} días con reportes`;

  const conteo = {};
  datosActuales.forEach(r => {
    const c = r.cuidadora || r.nombre_cuidadora || r.cuidador || 'Sin nombre';
    conteo[c] = (conteo[c]||0)+1;
  });
  document.getElementById('porCuidadora').innerHTML = Object.entries(conteo).map(([n,c]) => {
    const color = n.toLowerCase().includes('aracely') ? 'bg-purple-100 text-purple-800' : n.toLowerCase().includes('ibeth') ? 'bg-blue-100 text-blue-800' : n.toLowerCase().includes('carmita') ? 'bg-orange-100 text-orange-800' : 'bg-gray-100';
    return `<div class="flex justify-between"><span class="px-2 py-0.5 rounded-full text-xs ${color}">${n}</span><b>${c}</b></div>`;
  }).join('');

  renderTablaDinamica();

  // Muestra JSON crudo de 1 fila para que veas columnas reales
  if (datosActuales.length > 0) {
    document.getElementById('raw').classList.remove('hidden');
    document.getElementById('raw').textContent = 'Columnas detectadas: ' + Object.keys(datosActuales[0]).join(', ') + '\n\nEjemplo fila 1:\n' + JSON.stringify(datosActuales[0], null, 2);
  }
}

function renderTablaDinamica() {
  if (datosActuales.length === 0) {
    document.getElementById('thead').innerHTML = '';
    document.getElementById('tbody').innerHTML = '<tr><td class="p-4 text-center text-gray-500">Sin datos en este rango</td></tr>';
    return;
  }
  // Todas las columnas que existen
  const allKeys = [...new Set(datosActuales.flatMap(o => Object.keys(o)))];
  // Orden preferido: fecha, cuidadora primero, resto después
  const prefer = ['fecha','created_at','cuidadora','nombre_cuidadora','estado_general','estado','desayuno','almuerzo','merienda','hidratacion','medicacion','presion_arterial','actividades','estado_casa','observaciones','hora_acostarse','como_durmio','veces_desperto','motivo_despertar','fue_bano','como_amanecio'];
  const sortedKeys = [...prefer.filter(k => allKeys.includes(k)), ...allKeys.filter(k => !prefer.includes(k))];

  document.getElementById('thead').innerHTML = '<tr>' + sortedKeys.map(k => `<th class="px-2 py-2 text-left whitespace-nowrap">${k}</th>`).join('') + '</tr>';
  
  document.getElementById('tbody').innerHTML = datosActuales.map(r => {
    return '<tr class="border-t hover:bg-gray-50">' + sortedKeys.map(k => {
      let v = r[k];
      if (v === null || v === undefined) v = '';
      if (typeof v === 'string' && v.length > 80) v = v.substring(0,80) + '...';
      // Formatea fecha
      if ((k === 'fecha' || k === 'created_at') && v) {
        try { v = new Date(v).toLocaleString('es-EC'); } catch(e){}
      }
      return `<td class="px-2 py-1 whitespace-nowrap max-w-[200px] truncate" title="${r[k]||''}">${v}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function exportarCSV() {
  if (datosActuales.length === 0) { alert('No hay datos'); return; }
  const allKeys = [...new Set(datosActuales.flatMap(o => Object.keys(o)))];
  const rows = [allKeys.join(',')];
  datosActuales.forEach(r => {
    const row = allKeys.map(k => {
      const str = String(r[k] || '').replace(/"/g, '""').replace(/\n/g, ' ');
      return `"${str}"`;
    }).join(',');
    rows.push(row);
  });
  const blob = new Blob([rows.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rosita-consolidado-${document.getElementById('desde').value}_a_${document.getElementById('hasta').value}.csv`;
  a.click();
}

function copiarSheets() {
  if (datosActuales.length === 0) { alert('No hay datos'); return; }
  const allKeys = [...new Set(datosActuales.flatMap(o => Object.keys(o)))];
  const lines = [allKeys.join('\t')];
  datosActuales.forEach(r => {
    lines.push(allKeys.map(k => String(r[k]||'').replace(/\t|\n/g,' ')).join('\t'));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Copiado! Ve a Google Sheets y pega en A1'));
}

document.getElementById('btnCSV').addEventListener('click', exportarCSV);
document.getElementById('btnSheets').addEventListener('click', copiarSheets);
document.getElementById('btnFiltrar').addEventListener('click', cargarDatos);

window.addEventListener('DOMContentLoaded', () => {
  setDefaultDates();
  initClient();
  if (client) cargarDatos();
});
</script>
</body>
</html>
